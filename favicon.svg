<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="top">
      <rect x="0" y="0" width="100" height="50"/>
    </clipPath>
    <clipPath id="bottom">
      <rect x="0" y="50" width="100" height="50"/>
    </clipPath>
    <clipPath id="ball">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>

  <!-- Outer circle (black border) -->
  <circle cx="50" cy="50" r="48" fill="#222"/>

  <!-- Top half: US flag (simplified) -->
  <g clip-path="url(#top)">
    <g clip-path="url(#ball)">
      <!-- Red and white stripes -->
      <rect x="2" y="2" width="96" height="48" fill="#B22234"/>
      <rect x="2" y="5.7" width="96" height="3.7" fill="white"/>
      <rect x="2" y="13.1" width="96" height="3.7" fill="white"/>
      <rect x="2" y="20.5" width="96" height="3.7" fill="white"/>
      <rect x="2" y="27.9" width="96" height="3.7" fill="white"/>
      <rect x="2" y="35.3" width="96" height="3.7" fill="white"/>
      <rect x="2" y="42.7" width="96" height="3.7" fill="white"/>
      <!-- Blue canton -->
      <rect x="2" y="2" width="38" height="26" fill="#3C3B6E"/>
      <!-- Stars (simplified grid) -->
      <g fill="white">
        <circle cx="10" cy="6" r="1.5"/>
        <circle cx="18" cy="6" r="1.5"/>
        <circle cx="26" cy="6" r="1.5"/>
        <circle cx="34" cy="6" r="1.5"/>
        <circle cx="14" cy="10" r="1.5"/>
        <circle cx="22" cy="10" r="1.5"/>
        <circle cx="30" cy="10" r="1.5"/>
        <circle cx="10" cy="14" r="1.5"/>
        <circle cx="18" cy="14" r="1.5"/>
        <circle cx="26" cy="14" r="1.5"/>
        <circle cx="34" cy="14" r="1.5"/>
        <circle cx="14" cy="18" r="1.5"/>
        <circle cx="22" cy="18" r="1.5"/>
        <circle cx="30" cy="18" r="1.5"/>
        <circle cx="10" cy="22" r="1.5"/>
        <circle cx="18" cy="22" r="1.5"/>
        <circle cx="26" cy="22" r="1.5"/>
        <circle cx="34" cy="22" r="1.5"/>
        <circle cx="14" cy="26" r="1.5"/>
        <circle cx="22" cy="26" r="1.5"/>
        <circle cx="30" cy="26" r="1.5"/>
      </g>
    </g>
  </g>

  <!-- Bottom half: Japan flag -->
  <g clip-path="url(#bottom)">
    <g clip-path="url(#ball)">
      <rect x="2" y="50" width="96" height="48" fill="white"/>
      <circle cx="50" cy="74" r="14" fill="#BC002D"/>
    </g>
  </g>

  <!-- Pokeball center band -->
  <rect x="2" y="46" width="96" height="8" fill="#222" clip-path="url(#ball)"/>

  <!-- Center button -->
  <circle cx="50" cy="50" r="10" fill="#222"/>
  <circle cx="50" cy="50" r="7" fill="white"/>
  <circle cx="50" cy="50" r="4" fill="#222"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#222" stroke-width="3"/>
</svg>
